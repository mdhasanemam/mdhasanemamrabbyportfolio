name: Sync Google Scholar publications
on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 03:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch publications from Google Scholar
        run: python3 scripts/sync_scholar.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git diff --cached --quiet || (git commit -m "Sync publications from Google Scholar" && git push)
